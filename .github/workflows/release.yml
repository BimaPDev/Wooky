name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (without leading v, e.g. 0.1.0)"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Resolve release version
        id: version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            RAW="${{ inputs.version }}"
          else
            RAW="${GITHUB_REF_NAME}"
          fi
          VERSION="${RAW#v}"
          TAG="v${VERSION}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Build release bundle
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: node scripts/release.mjs --version "$VERSION"

      - name: Smoke test unpacked bundle
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: node install/test/smoke-bundle.mjs "dist-release/wooky-${VERSION}.tgz"

      - name: Publish GitHub Release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "$TAG" \
            "dist-release/wooky-${VERSION}.tgz" \
            "dist-release/SHA256SUMS" \
            "dist-release/install.sh" \
            "dist-release/install.ps1" \
            "dist-release/proxmox.sh" \
            --title "Wooky $TAG" \
            --generate-notes
